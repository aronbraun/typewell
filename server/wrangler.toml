# Cloudflare Worker config for the Typewell sign-in helper.
#
#   npx wrangler deploy          from inside this folder
#
# Everything secret is set with `wrangler secret put`, never written here —
# this file is in a public repository.

name = "typewell-auth"
main = "auth-worker.js"
compatibility_date = "2025-01-01"

[vars]
# Public, both of them. The client ID ships to every visitor anyway, and the
# allowed origin is just the address of your own site.
GOOGLE_CLIENT_ID = "PASTE-YOUR-CLIENT-ID.apps.googleusercontent.com"
ALLOWED_ORIGIN   = "https://typewell.net"
REDIRECT_URI     = "https://typewell-auth.YOUR-SUBDOMAIN.workers.dev/callback"

# GOOGLE_CLIENT_SECRET is NOT here on purpose. Set it once with:
#   npx wrangler secret put GOOGLE_CLIENT_SECRET
