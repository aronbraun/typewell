# Cloudflare Worker config for the Typewell sign-in helper.
#
# This file is what makes automatic deploys possible. Point Cloudflare's Git
# integration at this repository with a root directory of `server`, and every
# push to main redeploys the worker. Nothing else to run. See server/README.md.
#
# Deliberately generic. Nothing about any particular account, domain or Google
# project belongs in this file — it is in a public repository, and a config full
# of somebody's real values is a config every fork has to un-edit before it can
# be used.

name = "typewell-auth"
main = "auth-worker.js"
compatibility_date = "2025-01-01"

# THE IMPORTANT LINE. A deploy normally treats this file as the whole truth and
# wipes any variable set in the Cloudflare dashboard that is not repeated here.
# With automatic deploys that would mean every push silently emptying the
# worker's settings and breaking sign-in. This keeps the dashboard's values.
#
# Secrets are safe either way: Cloudflare never removes an encrypted value on a
# deploy, only on an explicit delete.
keep_vars = true

# No [vars] block on purpose — see above, and because the worker refuses to run
# with a setting missing and names the one that is absent, which is a clearer
# failure than a placeholder that looks configured and is not.
#
# It reads:
#   GOOGLE_CLIENT_ID       public — the same value the web page ships
#   ALLOWED_ORIGIN         public — the one site allowed to use this helper
#   GOOGLE_CLIENT_SECRET   secret — never in this file, never in the repository
#   REDIRECT_URI           optional — defaults to this worker's own /callback

# ── Logging ─────────────────────────────────────────────────────────────
#
# On, because this is the one piece of Typewell you cannot open in a browser
# and inspect when it misbehaves. Errors and uncaught exceptions are worth
# having.
#
# But invocation logs are OFF, and that is not a preference. Cloudflare writes
# one line per request, and for a fetch handler that line is "<method> <URL>" —
# the FULL url, query string included. This worker's /callback is reached as
#
#   GET https://auth.example.com/callback?code=4/0Ab...&state=...
#
# so leaving them on would file Google's authorization code into a log store,
# readable in the dashboard for days. The code is single-use and already spent
# by the time anyone reads it, and redeeming it would need the client secret
# too — so this is not a hole, it is a credential in a logfile for no reason.
# There is nothing here worth logging per request: the whole service is three
# routes and roughly one request per hour per person.
#
# Turning this back on is a decision about privacy, not about debugging.
# server/test.mjs fails if it is, so it cannot happen by accident.
[observability]
enabled = true

[observability.logs]
invocation_logs = false
