name: Deploy to GitHub Pages

# Production, and the only deploy path. Every push to main builds the site and
# hands it to GitHub Pages as an artifact:
#
#   https://typewell.net/                      (custom domain)
#   https://aronbraun.github.io/typewell/      (default domain)
#
# Requires Settings -> Pages -> Source = "GitHub Actions".
#
# An artifact deploy replaces the whole site on every run. That is why there are
# no per-PR previews any more: two things cannot live on the site at once, so a
# preview would delete production and production would delete the preview. It
# also means Jekyll never runs, so there is no .nojekyll to carry around, and
# the custom domain lives in the Pages settings rather than in a CNAME file.
# One place for each thing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. cancel-in-progress is false: a half-finished deploy is
# worse than a slow one, and pushes to main are rare enough that queueing costs
# nothing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The gate. Typewell is one file of contenteditable and execCommand, where a
  # fix to one control lands on another often enough that "it looked fine when
  # I clicked around" has shipped the same class of bug more than once. A red
  # suite does not reach typewell.net.
  test:
    name: Regression suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run the suite in headless Chrome
        run: node tests/run.mjs

  deploy:
    name: Build and deploy
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write # publish the artifact
      id-token: write # OIDC token the deploy step authenticates with

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build site
        env:
          # Passed through env, never interpolated into the script body:
          # ${{ }} is substituted before the shell ever sees the text, which
          # would let the value inject shell syntax.
          #
          # Reads the secret first, then the variable. An OAuth client ID is
          # public by design - it ships to every visitor, and what constrains it
          # is the Authorized JavaScript origins list in the Google console, not
          # secrecy - so a variable is the honest home for it. But it is stored
          # as a secret on this repo, and a workflow that silently ignores the
          # value you actually set is worse than an untidy one.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || vars.GOOGLE_CLIENT_ID }}
        run: |
          set -euo pipefail

          out=dist
          rm -rf "$out"
          mkdir -p "$out"
          cp index.html privacy.html terms.html "$out/"
          # PWA: the manifest, the worker and the icons it names. sw.js must
          # sit at the root or its scope cannot cover the whole site.
          cp manifest.webmanifest sw.js "$out/"
          # Crawlers. robots.txt and sitemap.xml are only read at the root, and
          # sitemap.xml lists exactly the three pages copied above - if that
          # list changes, change the sitemap too.
          cp robots.txt sitemap.xml llms.txt "$out/"
          cp -R icons "$out/"

          if [ -z "$GOOGLE_CLIENT_ID" ]; then
            echo "::warning::GOOGLE_CLIENT_ID is not set - the Drive panel will read 'not configured'"
          elif ! printf '%s' "$GOOGLE_CLIENT_ID" | grep -qE '^[A-Za-z0-9._-]+$'; then
            # Real client IDs are [A-Za-z0-9._-] only. Refusing anything else
            # keeps the value from being able to break out of the sed script
            # below, which is the one place it reaches a shell as syntax.
            echo "::error::GOOGLE_CLIENT_ID contains characters outside [A-Za-z0-9._-]; refusing to substitute"
            exit 1
          fi

          sed -i "s|__GOOGLE_CLIENT_ID__|${GOOGLE_CLIENT_ID}|g" "$out/index.html"

          # Fails the build rather than warning. A site that silently ships with
          # Drive switched off looks identical to one that works until someone
          # tries to connect, and the whole point of this step is that value.
          if grep -q '__GOOGLE_CLIENT_ID__' "$out/index.html"; then
            echo "::error::placeholder __GOOGLE_CLIENT_ID__ survived substitution"
            exit 1
          fi

          echo "Built $out:"
          ls -la "$out"

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5.0.0
