name: Deploy to GitHub Pages

# Production. Every push to main publishes the site to the ROOT of the
# `gh-pages` branch, which GitHub then serves at
#
#   https://typewell.net/                      (custom domain)
#   https://aronbraun.github.io/typewell/      (default domain)
#
# Requires Settings -> Pages -> Source = "Deploy from a branch",
# branch `gh-pages`, folder `/ (root)`. A *branch* deploy is deliberate: it is
# the only Pages mode where more than one thing can live on the site at once,
# which is what makes the per-PR previews in preview.yml possible. Under the
# "GitHub Actions" source an artifact deploy replaces the entire site on every
# run, so previews would delete production and vice versa.
#
# Consequences of a branch deploy that are easy to forget:
#   * Jekyll processes the branch, so `.nojekyll` must be in the published
#     payload. It is copied in by the build step below. Do not remove it.
#   * The `CNAME` file in the published branch is what binds typewell.net to
#     this site. It is written by the build step rather than committed to main,
#     so the custom domain is configured in exactly one place.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only at the top level; the one job that needs to write says so itself.
permissions:
  contents: read

# Shared with preview.yml. Both workflows push to the same branch, so they must
# take turns rather than race. cancel-in-progress is false: a half-finished
# deploy is worse than a slow one.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish to gh-pages
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the built site to the gh-pages branch

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # The deploy action builds its own authenticated remote, so the
          # checkout credentials are not needed and are better not left lying
          # around in .git/config.
          persist-credentials: false

      - name: Build site
        env:
          # Passed through env, never interpolated into the script body:
          # ${{ }} is substituted before the shell ever sees the text, which
          # would let the value inject shell syntax.
          #
          # A variable, not a secret. An OAuth client ID is public by design and
          # ships to every visitor; what constrains it is the Authorized
          # JavaScript origins list in the Google console, not secrecy.
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          CUSTOM_DOMAIN: typewell.net
        run: |
          set -euo pipefail

          out=dist
          rm -rf "$out"
          mkdir -p "$out"
          cp index.html privacy.html terms.html "$out/"

          # Required. Under a branch deploy GitHub runs the payload through
          # Jekyll unless this file is present at the site root.
          cp .nojekyll "$out/.nojekyll"

          # Authoritative for the custom domain under a branch deploy. Written
          # here rather than committed to main so that main stays host-agnostic.
          printf '%s\n' "$CUSTOM_DOMAIN" > "$out/CNAME"

          if [ -z "$GOOGLE_CLIENT_ID" ]; then
            echo "::warning::repository variable GOOGLE_CLIENT_ID is not set - the Drive panel will read 'not configured'"
          elif ! printf '%s' "$GOOGLE_CLIENT_ID" | grep -qE '^[A-Za-z0-9._-]+$'; then
            # Real client IDs are [A-Za-z0-9._-] only. Refusing anything else
            # keeps the value from being able to break out of the sed script
            # below, which is the one place it reaches a shell as syntax.
            echo "::error::GOOGLE_CLIENT_ID contains characters outside [A-Za-z0-9._-]; refusing to substitute"
            exit 1
          fi

          sed -i "s|__GOOGLE_CLIENT_ID__|${GOOGLE_CLIENT_ID}|g" "$out/index.html"

          if grep -q '__GOOGLE_CLIENT_ID__' "$out/index.html"; then
            echo "::warning::placeholder __GOOGLE_CLIENT_ID__ survived substitution"
          fi

          echo "Built $out:"
          ls -la "$out"

      - name: Deploy to gh-pages (root)
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          branch: gh-pages
          folder: dist
          # No target-folder: this writes the branch root.
          clean: true
          # ...but never touch the previews. Without this, every production
          # deploy would delete every open PR's preview.
          clean-exclude: |
            pr/
          # Rebase and retry on a conflicting push instead of force-pushing over
          # whatever landed in between. Never force_orphan / single-commit here:
          # both would discard the pr/ tree along with the history.
          force: false
          single-commit: false
          commit-message: "Deploy ${{ github.sha }} to gh-pages root"
          git-config-name: github-actions[bot]
          git-config-email: 41898282+github-actions[bot]@users.noreply.github.com
